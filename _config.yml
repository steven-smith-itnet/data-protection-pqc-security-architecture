# ---------------------------------------------------------------------------
# Site configuration for the enterprise data protection and PQC architecture
# Theme: Just the Docs (https://just-the-docs.com)
# ---------------------------------------------------------------------------

title: Data Protection & Post-Quantum Encryption Architecture
description: >-
  A phased, technology-level architecture for protecting enterprise data in a global hospitality organization: data inventory, classification, and labeling; encryption and key management for structured and unstructured data on-prem and in AWS, Azure, Google Cloud, and Oracle Cloud; and the migration to post-quantum cryptography.

url: "https://steven-smith-itnet.github.io"
baseurl: "/data-protection-pqc-security-architecture"

theme: just-the-docs

permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: default

# ---- Navigation & layout --------------------------------------------------
aux_links:
  "Executive briefing (slides)":
    - "/data-protection-pqc-security-architecture/slides/"
  "View on GitHub":
    - "https://github.com/steven-smith-itnet/data-protection-pqc-security-architecture"
aux_links_new_tab: true

nav_sort: case_insensitive

# ---- Search ---------------------------------------------------------------
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# ---- Look & feel ----------------------------------------------------------
color_scheme: dark
heading_anchors: true

# ---- Diagrams -------------------------------------------------------------
mermaid:
  version: "10.9.1"

# ---- Callouts -------------------------------------------------------------
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: yellow
  verify:
    title: Verify before use
    color: purple
  good:
    title: Good
    color: grey-dk
  better:
    title: Better
    color: blue
  best:
    title: Best
    color: green

# ---- Footer ---------------------------------------------------------------
footer_content: >-
  Prepared by Steven W. Smith (steven-smith-itnet). An independent reference architecture based on
  publicly available standards and vendor documentation. It is not affiliated with or endorsed by any
  hospitality company, cloud provider, or vendor. Cloud service features, preview status, and standards
  timelines change frequently: verify against current official documentation before use.

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/steven-smith-itnet/data-protection-pqc-security-architecture"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# ---- Build ----------------------------------------------------------------
# Suppress deprecation warnings in the theme's Sass dependencies.
# Warnings from the site's own stylesheets remain visible.
sass:
  quiet_deps: true

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - code
  - publish.sh
